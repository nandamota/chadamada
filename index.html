<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #f5f0e8; --warm-white: #faf8f4; --beige: #e8dfd0;
    --taupe: #c4b09a; --taupe-dark: #9e8472; --brown: #8b6f5a; --dark: #3d2f26;
  }
  body { background: var(--cream); display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: 'Jost', sans-serif; padding: 20px; }

  .tabs { display: flex; z-index: 2; }
  .tab-btn { background: var(--beige); border: none; padding: 12px 28px; font-family: 'Jost', sans-serif; font-weight: 200; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--taupe-dark); cursor: pointer; transition: all 0.3s ease; }
  .tab-btn:first-child { border-radius: 8px 0 0 0; }
  .tab-btn:last-child  { border-radius: 0 8px 0 0; }
  .tab-btn.active { background: var(--warm-white); color: var(--dark); }
  .tab-content { display: none; }
  .tab-content.active { display: flex; flex-direction: column; align-items: center; }

  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes expand { to { transform: scaleX(1); } }

  .card {
    width: 420px; min-height: 680px; background: var(--warm-white);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 52px 44px 44px;
    box-shadow: 0 20px 80px rgba(61,47,38,0.12), 0 4px 20px rgba(61,47,38,0.06);
    border-radius: 0 0 8px 8px;
    animation: fadeUp 1.2s ease forwards; opacity: 0; transform: translateY(20px);
  }

  .corner { position: absolute; pointer-events: none; }
  .corner-tl { top: 0; left: 0; width: 110px; height: 110px; }
  .corner-br { bottom: 0; right: 0; width: 110px; height: 110px; transform: rotate(180deg); }

  .line-top { width: 40px; height: 1px; background: var(--taupe); margin-bottom: 24px; animation: expand 1.5s ease 0.5s forwards; transform: scaleX(0); transform-origin: center; }
  .label { font-weight: 200; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--taupe); margin-bottom: 16px; animation: fadeUp 1s ease 0.3s forwards; opacity: 0; transform: translateY(10px); }
  .parents { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; animation: fadeUp 1s ease 0.5s forwards; opacity: 0; transform: translateY(10px); }
  .host { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 15px; color: var(--brown); letter-spacing: 1px; }
  .parents-amp { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: var(--taupe); }
  .convida { font-weight: 200; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--taupe); margin-bottom: 18px; animation: fadeUp 1s ease 0.6s forwards; opacity: 0; transform: translateY(10px); }
  .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; animation: fadeUp 1s ease 0.7s forwards; opacity: 0; transform: translateY(10px); }
  .divider-line { width: 28px; height: 1px; background: var(--beige); }
  .divider-dot  { width: 4px; height: 4px; border-radius: 50%; background: var(--taupe); }

  .diaper-motif { margin-bottom: 10px; animation: fadeUp 1s ease 0.75s forwards; opacity: 0; transform: translateY(10px); }

  .name { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic; font-size: 72px; color: var(--dark); line-height: 0.9; letter-spacing: -1px; text-align: center; margin-bottom: 6px; animation: fadeUp 1.2s ease 0.8s forwards; opacity: 0; transform: translateY(15px); }
  .cha-label { font-weight: 200; font-size: 9px; letter-spacing: 5px; text-transform: uppercase; color: var(--taupe); margin-top: 8px; margin-bottom: 30px; animation: fadeUp 1s ease 0.9s forwards; opacity: 0; transform: translateY(10px); }

  .info-block { width: 100%; border-top: 1px solid var(--beige); border-bottom: 1px solid var(--beige); padding: 20px 0; display: grid; grid-template-columns: 1fr 1px 1fr; animation: fadeUp 1s ease 1s forwards; opacity: 0; transform: translateY(10px); margin-bottom: 24px; }
  .info-item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0 16px; }
  .info-divider { background: var(--beige); width: 1px; }
  .info-label { font-weight: 200; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--taupe); }
  .info-value { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 17px; color: var(--dark); text-align: center; }
  .info-sub { font-weight: 300; font-size: 10px; color: var(--brown); text-align: center; }

  .local-block { display: flex; flex-direction: column; align-items: center; gap: 4px; animation: fadeUp 1s ease 1.1s forwards; opacity: 0; transform: translateY(10px); margin-bottom: 28px; text-align: center; }
  .local-label { font-weight: 200; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--taupe); }
  .local-link { text-decoration: none; }
  .local-value { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: var(--dark); font-weight: 300; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
  .local-link:hover .local-value { border-color: var(--taupe); }
  .local-sub  { font-weight: 200; font-size: 10px; color: #7a9e6e; }
  .local-city { font-weight: 200; font-size: 10px; color: var(--brown); letter-spacing: 1px; }

  .footer-note { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; color: var(--taupe); text-align: center; animation: fadeUp 1s ease 1.2s forwards; opacity: 0; transform: translateY(10px); }
  .line-bottom { width: 40px; height: 1px; background: var(--taupe); margin-top: 24px; animation: expand 1.5s ease 1.3s forwards; transform: scaleX(0); transform-origin: center; }

  /* â”€â”€ INNER CARDS â”€â”€ */
  .inner-card { width: 420px; background: var(--warm-white); padding: 40px 32px; box-shadow: 0 20px 80px rgba(61,47,38,0.12), 0 4px 20px rgba(61,47,38,0.06); border-radius: 0 0 8px 8px; position: relative; animation: fadeUp 0.8s ease forwards; opacity: 0; transform: translateY(20px); }
  .section-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 28px; color: var(--dark); text-align: center; margin-bottom: 4px; }
  .section-sub   { font-weight: 200; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--taupe-dark); text-align: center; margin-bottom: 6px; }
  .section-desc  { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: var(--brown); text-align: center; margin-bottom: 28px; line-height: 1.7; }

  /* â”€â”€ PRESENÃ‡A â”€â”€ */
  .confirm-input { width: 100%; border: none; border-bottom: 1.5px solid var(--beige); background: transparent; font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--dark); padding: 8px 0; outline: none; transition: border-color 0.2s; margin-bottom: 18px; }
  .confirm-input:focus { border-color: var(--taupe); }
  .confirm-input::placeholder { color: var(--beige); font-style: italic; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btn { flex: 1; border: 1.5px solid var(--beige); background: transparent; font-family: 'Jost', sans-serif; font-weight: 300; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--taupe-dark); padding: 12px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
  .confirm-btn.yes:hover { background: #e8f0e8; border-color: #a0b8a0; color: #3d6b3d; }
  .confirm-btn.no:hover  { background: #f0e8e8; border-color: #c4a0a0; color: #7a3d3d; }
  .thankyou { display: none; text-align: center; padding: 24px 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: var(--brown); line-height: 1.6; }

  /* â”€â”€ FRALDAS â”€â”€ */
  .size-block { margin-bottom: 20px; border: 1px solid var(--beige); border-radius: 8px; overflow: hidden; }
  .size-header { background: var(--beige); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  .size-name  { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 400; color: var(--dark); }
  .size-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .size-weight{ font-family: 'Jost', sans-serif; font-weight: 300; font-size: 10px; letter-spacing: 1.5px; color: var(--brown); text-transform: uppercase; }
  .size-qty   { font-family: 'Jost', sans-serif; font-weight: 300; font-size: 11px; color: var(--taupe-dark); }
  .size-body  { padding: 16px 18px; }
  .progress-bg   { width: 100%; height: 3px; background: var(--beige); border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
